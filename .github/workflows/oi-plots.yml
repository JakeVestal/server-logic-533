name: Nightly OI refresh

on:
  workflow_dispatch:
  schedule:
    # 03:00 UTC = 10pm EST / 11pm EDT. Runs every night.
    - cron: "0 3 * * *"

concurrency:
  group: oi-plots
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install lseg-data pandas plotly numpy

      - name: Generate plots
        env:
          LSEG_APP_KEY: ${{ secrets.LSEG_APP_KEY }}
          LSEG_USERNAME: ${{ secrets.LSEG_USERNAME }}
          LSEG_PASSWORD: ${{ secrets.LSEG_PASSWORD }}
        run: python nightly_refresh.py

      - name: Commit and push plots
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update OI cluster plots"
          file_pattern: |
            docs/oi-*.html
            docs/oi-clusters.csv
