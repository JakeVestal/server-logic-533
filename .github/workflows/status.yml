name: Luffy status

# Only one status run at a time. Newer runs cancel older ones.
# This prevents burst commits of docs/status.json that race Pages deployments.
concurrency:
  group: luffy-status
  cancel-in-progress: true

# No timer. Runs when:
#   - you click Actions → Luffy status → Run workflow
#   - Luffy calls publish_status.sh (manual, or the end of the price run)
#   - a deploy of host_files/ or server_files/ succeeds
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy to Luffy"]
    types: [completed]

permissions:
  contents: write

jobs:
  probe:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Join Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Ask Luffy
        id: probe
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOMELAB_HOST }}
          username: root
          key: ${{ secrets.HOMELAB_SSH_KEY }}
          capture_stdout: true
          script: |
            bash /opt/server-logic-533/host_files/dashboard_status.sh

      - name: Write status.json
        env:
          PROBE: ${{ steps.probe.outputs.stdout }}
        run: |
          python3 - << 'PY'
          import json, os, pathlib, re, sys
          text = os.environ.get("PROBE", "")
          m = re.search(
              r"===DASHBOARD_JSON_START===\n(.*)\n===DASHBOARD_JSON_END===",
              text,
              re.S,
          )
          if not m:
              sys.stderr.write(text[-2000:])
              sys.exit("probe did not return dashboard JSON")
          new_data = json.loads(m.group(1))
          path = pathlib.Path("docs/status.json")

          # Load existing if present so we can compare meaningful content
          existing = None
          if path.exists():
              try:
                  existing = json.loads(path.read_text())
              except Exception:
                  pass

          def meaningful(d):
              if not isinstance(d, dict):
                  return None
              return {
                  "ok": d.get("ok"),
                  "host": d.get("host"),
                  "repos": d.get("repos"),
              }

          if existing and meaningful(existing) == meaningful(new_data):
              print("status unchanged (repos identical); skipping write")
              sys.exit(0)

          path.write_text(json.dumps(new_data, indent=2) + "\n")
          print("status changed; wrote docs/status.json")
          PY

      - name: Commit status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/status.json
          git diff --cached --quiet && echo "status unchanged" && exit 0
          git commit -m "Update dashboard status"
          git push
